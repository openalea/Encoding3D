# The Julia codec (bindings/julia/FspmTF): its tests, on the oldest supported Julia and the latest release, and the
# conformance check other codecs run (its dumps of the conformance files compared with their expected values, the files
# it writes validated by fspm-tf validate and Khronos' glTF-Validator). OpenAlea's conda CI builds the Python package
# only.
name: Julia codec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
        os: [ubuntu-latest]
        include:
          - julia-version: "1"
            os: windows-latest
          - julia-version: "1"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: bindings/julia/FspmTF
      - uses: julia-actions/julia-runtest@v1
        with:
          project: bindings/julia/FspmTF

  # VirtualPlantLab's PlantGraphs needs Julia 1.12 or later: its extensions are tested in their own project
  virtualplantlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: PlantGraphs and PlantGeomTurtle extensions
        run: |
          julia --project=bindings/julia/FspmTF/test/plantgraphs -e 'using Pkg; Pkg.develop(path="bindings/julia/FspmTF"); Pkg.instantiate()'
          julia --project=bindings/julia/FspmTF/test/plantgraphs bindings/julia/FspmTF/test/plantgraphs/runtests.jl

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Dump and write the conformance scenes with the Julia codec
        run: |
          julia --project=bindings/julia/FspmTF -e 'using Pkg; Pkg.instantiate()'
          julia --project=bindings/julia/FspmTF bindings/julia/conformance_run.jl conformance out
      - uses: ./.github/actions/conformance
        with:
          dumps: out/dumps
          written: out/written
